name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public
        # No NODE_AUTH_TOKEN needed — OIDC token is issued automatically
        # by GitHub Actions when id-token: write permission is granted.
        # Set up trusted publishing on npmjs.com:
        #   Package settings → Access → Publishing → Trusted publishers
        #   Add: owner=ojas-mohbansi, repo=iiitn-auth-cli, workflow=release.yml
